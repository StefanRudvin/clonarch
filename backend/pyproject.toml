[project]
name = "clonarch"
version = "0.1.0"
description = "Private LAN household spending tracker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "google-re2>=1.1,<2",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clonarch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
